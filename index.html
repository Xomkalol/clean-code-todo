<html>
  <head>
    <title>Todo App</title>
    <link
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
      rel="stylesheet"
      type="text/css"
    />
    <link
      rel="stylesheet"
      href="style.css"
      type="text/css"
      media="screen"
      charset="utf-8"
    />
  </head>
  <body>
    <div class="eisenhower-image__wrapper">
      <img src="./eisenhower-matrix.jpg" /><a
        class="eisenhower-image__link"
        href="https://goal-life.com/page/method/matrix-eisenhower"
        >Want more details&quest;</a
      >
    </div>
    <div class="centered-main-page-element">
      <p id="topSectionForAddingElementToList">
        <label for="new-task">Add Item</label>
      </p>
      <div class="task-row-wrapper">
        <input id="new-task" class="task-input" type="text" /><button>Add</button>
      </div>
      <h3>Todo</h3>
      <ul id="incompleteTasks">
        <li>
          <input type="checkbox" /><label class="task-input">Pay Bills</label
          ><input type="text" class="task-input" /><button class="edit">Edit</button
          ><button class="delete">
            <img src="./remove.svg" alt="remove icon" />
          </button>
        </li>
        <li class="editMode">
          <input type="checkbox" /><label class="task-input">Go Shopping</label
          ><input type="text" value="Go Shopping" class="task-input" /><button
            class="edit"
          >
            Save</button
          ><button class="delete">
            <img src="./remove.svg" alt="remove icon" />
          </button>
        </li>
      </ul>
      <h3>Completed</h3>
      <ul id="completed-tasks">
        <li>
          <input type="checkbox" checked /><label class="task-input"
            >See the Doctor</label
          ><input type="text" class="task-input" /><button class="edit">Edit</button
          ><button class="delete">
            <img src="./remove.svg" alt="remove icon" />
          </button>
        </li>
      </ul>
    </div>
    <script type="text/javascript" src="app.js"></script>
  </body>
</html>
